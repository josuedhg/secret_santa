{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - Secret Santa</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="container">
    <div class="header-banner">
      <div class="logo-icon">🎅</div>
      <h1>{{.EventTitle}}</h1>
      <p>{{.EventDescription}}</p>
    </div>

    {{if .Error}}
      <div class="alert alert-error">
        <span>⚠️</span>
        <div>{{.Error}}</div>
      </div>
    {{end}}

    {{if .Success}}
      <div class="alert alert-success">
        <span>✅</span>
        <div>{{.Success}}</div>
      </div>
    {{end}}

    {{template "content" .}}
  </div>

  <footer>
    <p>Secret Santa Application &bull; Built with Go &bull; Happy Holidays! 🎄</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
{{end}}
